[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heatmap-tracking"
version = "0.1.0"
description = "ML Heatmap and Tracking System"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "ultralytics>=8.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "redis>=4.6.0",
    "minio>=7.1.0"
]

[tool.setuptools.packages.find]
include = ["core*", "infrastructure*", "ml_worker*", "dashboard*", "camera_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=core --cov=ml_worker --cov=infrastructure"
