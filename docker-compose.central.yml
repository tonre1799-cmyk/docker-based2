services:
  # ============================================
  # Infrastructure Services
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "6831:6831/udp" # Jaeger Thrift Agent
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  backup:
    image: offen/docker-volume-backup:latest
    container_name: volume-backup
    volumes:
      - postgres_data:/backup/postgres:ro
      - minio_data:/backup/minio:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      - BACKUP_FILENAME=backup-%Y%m%d.tar.gz
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # Remote Backup (S3/MinIO compatible)
      - AWS_S3_BUCKET_NAME=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_KEY}
      - AWS_S3_ENDPOINT=${BACKUP_S3_ENDPOINT}
      # Encryption
      - GPG_PASSPHRASE=${BACKUP_ENCRYPTION_KEY}
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: analytics-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: analytics-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: kerberos-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:6.0
    container_name: kerberos-mongodb
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  vault:
    image: kerberos/vault:latest
    container_name: kerberos-vault
    ports:
      - "8081:80"
    environment:
      - VAULT_MONGODB_URI=mongodb://mongodb:27017
      - VAULT_STORAGE_PROVIDER=s3
      - VAULT_STORAGE_S3_ENDPOINT=http://minio:9000
      - VAULT_STORAGE_S3_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - VAULT_STORAGE_S3_SECRET_KEY=${MINIO_SECRET_KEY}
      - VAULT_STORAGE_S3_BUCKET=${MINIO_BUCKET:-recordings}
      - VAULT_STORAGE_S3_REGION=us-east-1
      - VAULT_WEBHOOK_URL=http://dispatcher:5000/webhook
    depends_on:
      - mongodb
      - minio
    restart: unless-stopped

  # ============================================
  # Central Application Services
  # ============================================
  dispatcher:
    build:
      context: .
      target: dispatcher
    # container_name: event-dispatcher (Remove for scaling)
    # ports:
    #   - "5000:5000" (Exposed via LB)
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JAEGER_HOST=jaeger
    depends_on:
      - redis
      - minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  dispatcher-lb:
    image: nginx:alpine
    container_name: dispatcher-lb
    ports:
      - "5000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dispatcher
    restart: unless-stopped

  db-migrator:
    build:
      context: .
      target: ml-worker
    command: [ "alembic", "upgrade", "head" ]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ml_worker:
    build:
      context: .
      target: ml-worker
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_MODE=redis
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-recordings}
      - CONFIG_DIR=/app/config
      - RECORDINGS_DIR=/app/data/vault/recordings
      - PROCESSED_DIR=/app/data/processed
      - QUEUE_TTL_SECONDS=${QUEUE_TTL_SECONDS:-300}
      - JAEGER_HOST=jaeger
    command: [ "python", "-m", "ml_worker.consumer_redis" ]
    healthcheck:
      test: [ "CMD", "python", "-m", "ml_worker.database" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./config:/app/config
      - ./data/heatmaps:/app/data/heatmaps
      - ./data/agent/recordings:/app/data/vault/recordings:ro
      - ./customer_config.yaml:/app/customer_config.yaml:ro
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: on-failure
    stop_grace_period: 60s

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: analytics-dashboard
    command: [ "streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8501:8501"
    environment:
      - DB_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-analytics}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./data/heatmaps:/app/data/heatmaps
      - ./customer_config.yaml:/app/customer_config.yaml:ro
    depends_on:
      - postgres
    restart: unless-stopped
  # Camera API can run centrally too? User didn't specify strict exclusive, 
  # but user said "Edge device runs centralized database (waste)... Central server runs agent (duplicate)"
  # Implies clean separation.
  # If needed, camera_api could be in both or just edge.
  # I'll put it in Edge for now as it seems to manage cameras, which might be edge-related.
  # But managing cameras centrally is also valid. I'll omit from Central unless required.
  # Note: Actual service implementations are in .central.yml and .edge.yml
