version: '3.8'

services:
  # 1. Real Infrastructure
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: prod_password
      POSTGRES_DB: prod_db
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U prod_user -d prod_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e2e-net

  # 2. System Under Test (The actual App)
  app:
    build:
      context: .
      target: runtime
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: prod_password
      POSTGRES_DB: prod_db
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  # 3. E2E Runner (Simulates User)
  e2e-runner:
    image: myapp:test
    command: pytest tests/e2e/test_system_health.py -v
    environment:
      APP_URL: http://app:8501
    depends_on:
      app:
        condition: service_started
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge
